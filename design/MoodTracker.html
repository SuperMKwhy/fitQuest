<style>

        color: #1c1b1b;
    }
    .chibi-border {

    }

    }
    .chibi-shadow-sm {
        box-shadow: 2px 2px 0px 0px #1c1b1b;

        transform: translate(4px, 4px);

<body class="bg-surface font-body-md text-on-surface flex justify-center min-h-screen">
<div class="w-full max-w-[480px] bg-surface relative min-h-screen flex flex-col chibi-border pb-24">
<header class="flex justify-between items-center px-margin-mobile py-4 w-full bg-surface border-b-[3px] border-on-background shadow-[4px_4px_0px_0px_#1c1b1b] sticky top-0 z-50">
<div class="flex items-center gap-sm">
<button class="chibi-border chibi-shadow-sm bg-surface-container p-2 rounded-lg chibi-active flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight uppercase">Mood Tracker</h1>
</div>
<button class="chibi-border chibi-shadow-sm bg-surface-container p-2 rounded-lg chibi-active flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<main class="flex-1 flex flex-col gap-md p-margin-mobile">
<div class="bg-surface chibi-border chibi-shadow rounded-xl p-md flex items-center justify-between">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile uppercase">15 June 2026</h2>
<span class="material-symbols-outlined text-[32px]">calendar_today</span>
</div>
<section class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md uppercase">I feel...</h3>
<div class="flex justify-between bg-surface chibi-border chibi-shadow rounded-xl p-sm">
<button class="p-2 chibi-border rounded-lg bg-primary-container chibi-active flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[40px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</button>
<button class="p-2 chibi-border rounded-lg bg-surface-container chibi-active flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">sentiment_dissatisfied</span>
</button>
<button class="p-2 chibi-border rounded-lg bg-surface-container chibi-active flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">mood_bad</span>
</button>
<button class="p-2 chibi-border rounded-lg bg-surface-container chibi-active flex flex-col items-center gap-xs">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">sick</span>
</button>
</div>
</section>
<section class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md uppercase">Daily Diary</h3>
<textarea class="w-full h-32 bg-surface chibi-border chibi-shadow rounded-xl p-sm font-body-md resize-none focus:outline-none focus:border-primary focus:ring-0" placeholder="Write about your adventure today..."></textarea>
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md uppercase chibi-border chibi-shadow rounded-xl py-3 chibi-active mt-2">
                Save Log
            </button>
</section>
<section class="mt-4 flex flex-col gap-sm">
<div class="flex justify-between items-end mb-2">
<h3 class="font-headline-md text-headline-md uppercase">June</h3>
<span class="font-label-md text-label-md">2026</span>
</div>
<div class="grid grid-cols-7 chibi-border rounded-xl overflow-hidden bg-surface">
<!-- Day Headers -->
<div class="text-center font-label-sm py-2 border-b-[3px] border-r-[3px] border-on-background">S</div>
<div class="text-center font-label-sm py-2 border-b-[3px] border-r-[3px] border-on-background">M</div>
<div class="text-center font-label-sm py-2 border-b-[3px] border-r-[3px] border-on-background">T</div>
<div class="text-center font-label-sm py-2 border-b-[3px] border-r-[3px] border-on-background">W</div>
<div class="text-center font-label-sm py-2 border-b-[3px] border-r-[3px] border-on-background">T</div>
<div class="text-center font-label-sm py-2 border-b-[3px] border-r-[3px] border-on-background">F</div>
<div class="text-center font-label-sm py-2 border-b-[3px] border-on-background">S</div>

<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">1</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold relative flex items-center justify-center">
<span class="absolute top-1 left-1 text-xs">2</span>
<span class="material-symbols-outlined text-[20px] text-primary" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">3</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">4</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">5</div>
<div class="aspect-square border-b-[3px] border-on-background p-1 font-bold">6</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">7</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">8</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold relative flex items-center justify-center">
<span class="absolute top-1 left-1 text-xs">9</span>
<span class="material-symbols-outlined text-[20px] text-secondary-container" style="font-variation-settings: 'FILL' 1;">sentiment_dissatisfied</span>
</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">10</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">11</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">12</div>
<div class="aspect-square border-b-[3px] border-on-background p-1 font-bold">13</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">14</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold bg-primary-container relative flex items-center justify-center">
<span class="absolute top-1 left-1 text-xs text-on-primary-container">15</span>
<span class="material-symbols-outlined text-[20px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">sentiment_very_satisfied</span>
</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">16</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">17</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">18</div>
<div class="aspect-square border-b-[3px] border-r-[3px] border-on-background p-1 font-bold">19</div>
<div class="aspect-square border-b-[3px] border-on-background p-1 font-bold">20</div>
</div>
