<style>
        .chibi-shadow {
            box-shadow: 4px 4px 0px 0px #1c1b1b;
        }
        .chibi-active:active {
            box-shadow: 0px 0px 0px 0px #1c1b1b;
            transform: translate(4px, 4px);
        }
        .stat-bar-sheen {
            background-image: repeating-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.2),
                rgba(255, 255, 255, 0.2) 10px,

                transparent 20px

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface">
<!-- TopAppBar -->
<header class="w-full border-b-[3px] border-on-background flex justify-between items-center px-margin-mobile py-sm bg-background">
<button aria-label="Go Back" class="flex items-center justify-center w-10 h-10 rounded-full border-[3px] border-on-background bg-surface chibi-shadow chibi-active transition-all">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">Calories Tracker</h1>
<button aria-label="Settings" class="flex items-center justify-center w-10 h-10 rounded-full border-[3px] border-on-background bg-surface chibi-shadow chibi-active transition-all">
<span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center px-margin-mobile py-md gap-md overflow-y-auto">
<!-- Heading -->
<div class="text-center w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface uppercase tracking-wider">Take a Photo!</h2>
</div>
<!-- Camera Viewfinder -->
<div class="w-full max-w-sm aspect-[4/5] bg-surface-container-highest border-[3px] border-on-background rounded-xl relative chibi-shadow overflow-hidden flex flex-col items-center justify-center">
<!-- Target Reticle Overlay -->
<div class="absolute inset-0 pointer-events-none p-4 flex flex-col justify-between z-10">
<div class="flex justify-between w-full">
<div class="w-8 h-8 border-t-[4px] border-l-[4px] border-primary-fixed-dim"></div>
<div class="w-8 h-8 border-t-[4px] border-r-[4px] border-primary-fixed-dim"></div>
</div>
<div class="flex justify-between w-full">
<div class="w-8 h-8 border-b-[4px] border-l-[4px] border-primary-fixed-dim"></div>
<div class="w-8 h-8 border-b-[4px] border-r-[4px] border-primary-fixed-dim"></div>
</div>
</div>
<!-- Viewfinder Image -->
<div class="absolute inset-0 w-full h-full">
<img alt="Food photo viewfinder" class="w-full h-full object-cover pixelated" data-alt="A detailed 16-bit pixel art illustration of a plate of Basil Chicken Rice. The scene is brightly lit with a cheerful, nostalgic gaming vibe. The dish features a mound of white rice topped with savory brown minced chicken and vibrant green basil leaves, accompanied by a bright yellow fried egg with crispy edges. The background is a soft, abstracted retro gaming grid pattern in muted off-white tones. The art style emphasizes thick, chunky pixel outlines and a limited, high-contrast color palette typical of early 90s console games." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOC7HrhO7lQ0SaHx8t2z0Pq4x-9MOtJi0dfp81YiOzZWdEs-rFzlgFsR4bkmWmWIReN_G7LV7XwHCGd17G4Baa4dkNrgnWpvErOstI0mbtQrukexipA-lHM5_4PlcL0Ms4bU1VOOxCetQcD6BGUCZugaEbd0I_fjx4H6j6r7OCfN7qBt-8rwFtlPfurVuKYS3FRIm-hLzzleMBVvhBuvub4xtf4_M8894VB5DSuk8_fF_2vnPWEUw" style="image-rendering: pixelated;"/>
</div>
<!-- Scanning Overlay (Simulated) -->
<div class="absolute inset-0 bg-primary-fixed-dim/20 mix-blend-overlay z-0"></div>
<div class="absolute top-0 w-full h-1 bg-primary shadow-[0_0_8px_#50ddb7] animate-[scan_2s_ease-in-out_infinite] z-20"></div>
<!-- Shutter Button Container -->
<div class="absolute bottom-6 left-0 right-0 flex justify-center z-30">
<button aria-label="Take Photo" class="w-16 h-16 rounded-full border-[4px] border-tertiary-fixed-dim bg-surface flex items-center justify-center chibi-shadow chibi-active transition-all group">
<div class="w-10 h-10 rounded-full border-[2px] border-on-background bg-error group-active:bg-secondary-fixed transition-colors"></div>
</button>
</div>
</div>
<!-- Result Card -->
<div class="w-full max-w-sm bg-surface border-[3px] border-on-background rounded-xl p-md chibi-shadow flex flex-col gap-sm">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-xs">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<h3 class="font-label-md text-label-md uppercase text-on-surface tracking-wide">Basil Chicken Rice</h3>
</div>
<div class="inline-block bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-2 py-1 rounded-full border-[2px] border-on-background w-fit">
                        Total 500 kcal
                    </div>
</div>
</div>
<!-- Macro Breakdown -->
<div class="flex flex-col gap-xs mt-2">
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant">
<span>Protein 20%</span>
<span>Carb 50%</span>
<span>Fat 30%</span>
</div>
<!-- Custom Segmented Stat Bar -->
<div class="h-4 w-full bg-surface-container border-[3px] border-on-background rounded-full flex overflow-hidden">
<div class="h-full bg-primary stat-bar-sheen w-[20%]" title="Protein"></div>
<div class="h-full bg-tertiary-fixed-dim stat-bar-sheen w-[50%] border-l-[2px] border-on-background" title="Carbs"></div>
<div class="h-full bg-secondary-container stat-bar-sheen w-[30%] border-l-[2px] border-on-background" title="Fat"></div>
</div>
</div>
</div>
<!-- Confirm Button -->
<button class="w-full max-w-sm mt-4 py-3 bg-primary-container text-on-primary-container border-[3px] border-on-background rounded-xl font-label-md text-label-md uppercase tracking-wider chibi-shadow chibi-active transition-all flex justify-center items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            CONFIRM
        </button>
</main>
<style>
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</body></html>
