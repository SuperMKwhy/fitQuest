<style>
        /* Brutalist / Tactile Retro specific styles */
        .chibi-border {
            border: 3px solid #1c1b1b;
        }
        .chibi-shadow {
            box-shadow: 4px 4px 0px 0px #1c1b1b;
        }
        .chibi-active {
            border: 3px solid #1c1b1b;
            box-shadow: 4px 4px 0px 0px #1c1b1b;
            transition: all 0.1s ease-in-out;
        }
        .chibi-active:active, .chibi-active.active {
            box-shadow: 0px 0px 0px 0px #1c1b1b;
            transform: translate(4px, 4px);
        }
        .chibi-card {
            border: 3px solid #1c1b1b;
            background-color: #ffffff;
        }
        .pixel-sparkle-primary { color: #50ddb7; }
        .pixel-sparkle-tertiary { color: #e0b331; }
        .pixel-sparkle-secondary { color: #ff6b6b; }
        
        /* Custom radio button styling */
        input[type="radio"] {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border: 3px solid #1c1b1b;
            border-radius: 4px; /* Square with slight rounding */
            background-color: white;
            outline: none;
            cursor: pointer;
            position: relative;
        }
        input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background-color: #50ddb7; /* Mint fill */
            border-radius: 2px;
        }
        
        /* Progress bar steps */
        .step-node {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 3px solid #1c1b1b;
            background-color: #ffffff;
            position: relative;
            z-index: 10;
        }
        .step-node.active {
            background-color: #50ddb7;
        }
        .step-line {
            height: 3px;
            background-color: #1c1b1b;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 0;
            right: 0;
            z-index: 0;
        }
    </style>

<p class="">There's <span class="text-primary font-bold">no wrong answer!</span></p>

<!-- Bottom Action -->
<div class="w-full max-w-md mt-auto pt-md pb-4">
<button class="w-full chibi-active bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-xl uppercase tracking-wide hover:bg-primary-fixed transition-colors" type="button">
            CONTINUE
        </button>
</div>
<script>
        // Simple interactivity for radio buttons to highlight the selected card
        document.querySelectorAll('input[name="goal"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Reset all cards
                document.querySelectorAll('label.chibi-card').forEach(label => {
                    label.classList.remove('bg-surface-container');
                    label.classList.add('bg-white');
                });
                // Highlight selected
                if(e.target.checked) {
                    const label = e.target.closest('label');
                    label.classList.add('bg-surface-container');
                    label.classList.remove('bg-white');
                }
            });
        });
        
        // Initialize state
        const initialSelected = document.querySelector('input[name="goal"]:checked');
        if(initialSelected) {
            initialSelected.closest('label').classList.add('bg-surface-container');
            initialSelected.closest('label').classList.remove('bg-white');
        }
    </script>
