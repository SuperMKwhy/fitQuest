<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top Navigation -->
<header class="w-full top-0 sticky bg-background border-b-border-weight border-on-background z-40 flex justify-between items-center px-margin-mobile py-sm">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors active:translate-x-[2px] active:translate-y-[2px]">

</button>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight">SHOP</h1>
<div class="flex items-center gap-2">
<div class="flex items-center bg-tertiary-container text-on-tertiary-container px-2 py-1 rounded-lg chibi-border chibi-shadow-sm">

<span class="font-label-md">2000</span>
</div>
<div class="flex items-center bg-primary-container text-on-primary-container px-2 py-1 rounded-lg chibi-border chibi-shadow-sm">

</div>

<span class="material-symbols-outlined text-headline-md">shopping_basket</span>
<span class="absolute -top-2 -right-2 bg-secondary-container text-on-secondary-container font-label-sm w-6 h-6 rounded-full flex items-center justify-center chibi-border">2</span>
</button>

<div class="w-16 h-16 bg-surface-container-low rounded-lg flex items-center justify-center chibi-border">

<div class="flex items-center gap-1 bg-tertiary-container px-2 py-1 rounded-md chibi-border w-full justify-center">
<span class="material-symbols-outlined text-[14px] text-on-tertiary-container">monetization_on</span>
<span class="font-label-sm text-on-tertiary-container">400</span>

<button class="bg-surface-container-lowest rounded-xl chibi-border p-3 flex flex-col items-center gap-2 relative hover:bg-surface-container-high active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all text-left">
<div class="w-16 h-16 bg-surface-container-low rounded-lg flex items-center justify-center chibi-border">
<span class="material-symbols-outlined text-4xl text-on-surface">laundry</span>
</div>

<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-3 hover:bg-surface-container-high transition-colors rounded-lg" href="#">

<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-lg border-[3px] border-on-background shadow-[4px_4px_0_0_#1c1b1b] py-1 px-3 -mt-4 active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all" href="#">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
<span class="font-label-sm text-[10px]">SHOP</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-3 hover:bg-surface-container-high transition-colors rounded-lg" href="#">
<span class="material-symbols-outlined text-2xl mb-1">person</span>
