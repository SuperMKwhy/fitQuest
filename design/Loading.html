<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>FitQuest Loading Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'pixel-bg': '#F8F7F2',
            'pixel-mint': '#3ECFAA',
            'pixel-coral': '#F26D6D',
            'pixel-dark': '#1C1C1C',
            'pixel-border': '#333333'
          },
          fontFamily: {
            'pixel': ['"Press Start 2P"', 'cursive'],
          },
          keyframes: {
            stripe: {
              '0%': { backgroundPosition: '0 0' },
              '100%': { backgroundPosition: '40px 0' },
            },
            bounce: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            },
            fillBar: {
              '0%': { width: '0%' },
              '100%': { width: '100%' }
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' }
            }
          },
          animation: {
            'stripe-move': 'stripe 1s linear infinite',
            'pixel-bounce': 'bounce 0.5s infinite',
            'progress-fill': 'fillBar 3s ease-in-out forwards',
            'fade-in-delayed': 'fadeIn 0.5s ease-in forwards 3s'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    .pixel-shadow {
      box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
    }
    .pixel-border-box {
      border: 4px solid #333;
      border-radius: 24px;
    }
    .progress-bar-stripes {
      background-image: linear-gradient(
        45deg, 
        rgba(255, 255, 255, 0.3) 25%, 
        transparent 25%, 
        transparent 50%, 
        rgba(255, 255, 255, 0.3) 50%, 
        rgba(255, 255, 255, 0.3) 75%, 
        transparent 75%, 
        transparent
      );
      background-size: 20px 20px;
    }
    .pixel-text-shadow {
      text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="bg-pixel-bg h-screen w-screen flex flex-col items-center justify-center font-pixel overflow-hidden select-none">
<!-- BEGIN: MainContent -->
<main class="flex flex-col items-center justify-center w-full max-w-[375px] h-full p-6 relative gap-12" data-purpose="loading-container">
<!-- Logo Container -->
<div class="pixel-border-box bg-[#FEFDF9] p-8 flex flex-col items-center justify-center relative w-64 h-64 shadow-[8px_8px_0px_rgba(210,205,190,0.5)]" data-purpose="logo-card">
<div class="absolute inset-0 flex items-center justify-center">
<img alt="FitQuest Logo" class="w-full h-full object-contain rounded-[20px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAa3Ir4VO-58MEW4_NnbvnOecR7kGtbJR1ncSj7ZiWgI6BwfNKkqIDMtB8NvfWPkPcKlceDYREhSJuYvYNLZKcDGahH4fqrjaPx_jFfI3HUgloLR2U3lgTfUQZtKbPgt8WNaoCbqhQIcJTaO-mSDVL18qsRvsReYsCkwoMBIFEYCpIacc1tKifByxjFnouNvZTK-cF3H5UmQottvJQWUEHE80WkW2QHtX4Ez6MYP7P4s_CDtXojj4A">
</div>
</div>
<!-- Loading Section -->
<div class="flex flex-col items-center w-full gap-4 relative z-10" data-purpose="loading-status">
<!-- Loading Text -->
<div class="flex items-center gap-2 text-pixel-mint text-sm">
<span class="animate-pulse">✦</span>
<span class="tracking-widest">LOADING...</span>
<span class="animate-pulse">✦</span>
</div>
<!-- Progress Bar Container -->
<div class="w-full relative h-8 flex items-center">
<div class="w-full h-full border-4 border-pixel-border rounded-xl bg-[#F0EBE0] overflow-hidden p-1 relative">
<!-- Animated Fill -->
<div class="h-full bg-pixel-mint rounded-lg progress-bar-stripes animate-stripe-move animate-progress-fill w-0 relative" id="progressBar">
</div>
</div>
<!-- Running Character -->
<div class="absolute right-[-32px] top-[-48px] w-24 h-24 z-20" id="runnerChar" style="transform: translateY(0px);">
<!-- Placeholder for chibi runner since specific image isn't sliced, using emoji as rough fallback for visual representation in code -->
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLxdHaN1Ix9oLRcSNwlD1mtQR7Pkgm7Erlyj8IdpaIo5NzGdTkaT3s9mwosPJxXu0Xm_zh51T6HDRNtYdjEWUjKbID_T33rZtbVRU0c5693-NgT4GWAgbce516DoZBCqyoTmlN3xgK4AvQvFSUjzscg4g65vlhlMTSaV5Tgfrq58TSi1rq1KeMrAsc5E9bcp7NSYWoCBoTgckEVuH7AsZyWQmXuKNmAYpE-dfcSJplqgAllYtygMAnFTOtz2iYtzIrQwqqPydYZzkc" alt="Running Character" class="h-24 w-auto object-contain">
</div>
</div>
<!-- Tagline -->
<div class="text-center mt-4 text-[10px] leading-relaxed text-pixel-dark flex items-center justify-center gap-2 max-w-[200px]">

<span class=""><br></span>

</div>
<!-- Start Button (Hidden initially) -->
<button class="opacity-0 absolute bottom-[-60px] bg-pixel-mint text-white border-4 border-pixel-border py-3 px-6 rounded-xl hover:bg-[#2EB896] transition-colors pixel-shadow active:translate-y-[4px] active:shadow-none animate-fade-in-delayed" id="startBtn">GO!</button>
</div>
</main>
<!-- END: MainContent -->
<!-- Script to handle start button interaction -->
<script data-purpose="loading-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.getElementById('startBtn');
      const progressBar = document.getElementById('progressBar');
      const runnerChar = document.getElementById('runnerChar');
      
      // Wait for animation to finish
      setTimeout(() => {
        startBtn.classList.remove('pointer-events-none');
        // Stop runner animation visually when full
        runnerChar.classList.remove('animate-pixel-bounce');
        runnerChar.style.transform = 'translateY(0)';
      }, 3000); // 3 seconds matches CSS animation

      startBtn.addEventListener('click', () => {
        startBtn.innerHTML = 'GO!';
        setTimeout(() => {
          // Placeholder for navigation
          console.log('Navigate to main app');
        }, 500);
      });
    });
  </script>






</body></html>
